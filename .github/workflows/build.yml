name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: 打包 EXE
        run: |
          pyinstaller --onefile --windowed diancai.py

      - name: 保存 EXE
        uses: actions/upload-artifact@v4
        with:
          name: diancai-windows
          path: dist/diancai.exe
